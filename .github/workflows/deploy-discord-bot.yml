name: Deploy Discord Bot to Cloudflare Workers

on:
  push:
    branches: [develop,main]
    paths:
      - 'discord-bot/**'

# デプロイ先（Worker とグローバルのスラッシュコマンド定義）単位のグループ。
# develop/main の両方から同じ Worker・同じコマンド定義に反映されるため、ブランチを跨いで直列化し、
# 新しいコミットの実行を優先する（古い実行が後からデプロイやコマンド登録を完了するのを防ぐ）。
concurrency:
  group: deploy-discord-bot
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: discord-bot/package-lock.json

      - name: Install dependencies
        working-directory: discord-bot
        run: npm ci

      - name: Deploy to Cloudflare Workers
        working-directory: discord-bot
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # スラッシュコマンド定義（オプション等）を Discord に登録する。
      # 一括上書き（PUT）なので、定義に変更がなくても毎回実行して問題ない。
      # Worker の新しい処理が先に動いている状態で定義を反映するため、デプロイ後に実行する。
      - name: Register slash commands
        working-directory: discord-bot
        run: npm run deploy-commands
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
