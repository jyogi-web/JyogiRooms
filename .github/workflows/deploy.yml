name: Deploy to Cloud Run

on:
  push:
    branches: [main]

env:
  PROJECT_ID: jyogirooms
  REGION: asia-northeast1
  IMAGE: asia-northeast1-docker.pkg.dev/jyogirooms/jyogi-rooms/app

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/877085301688/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: 877085301688-compute@developer.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: jyogirooms
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}:${{ github.sha }}
