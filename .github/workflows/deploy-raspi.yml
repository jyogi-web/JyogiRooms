name: Deploy to Raspberry Pi

on:
  push:
    branches: [develop,main]
    paths-ignore:
      - 'discord-bot/**'

jobs:
  deploy:
    runs-on: [self-hosted, raspi]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Create .env.production
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          JYOGI_AUTH_URL: ${{ secrets.JYOGI_AUTH_URL }}
          REDIRECT_URI: ${{ secrets.REDIRECT_URI }}
          API_ACCESS_TOKEN: ${{ secrets.API_ACCESS_TOKEN }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          ANNOUNCE_CHANNEL_ID: ${{ secrets.ANNOUNCE_CHANNEL_ID }}
          ENTRY_CHANNEL_ID: ${{ secrets.ENTRY_CHANNEL_ID }}
          ADMIN_DISCORD_IDS: ${{ secrets.ADMIN_DISCORD_IDS }}
          VIEW_LOG_INGEST_URL: ${{ secrets.VIEW_LOG_INGEST_URL }}
          VIEW_LOG_INGEST_SECRET: ${{ secrets.VIEW_LOG_INGEST_SECRET }}
        run: |
          env | grep -E '^(DATABASE_URL|RAILS_MASTER_KEY|CLIENT_ID|CLIENT_SECRET|FRONTEND_URL|JYOGI_AUTH_URL|REDIRECT_URI|API_ACCESS_TOKEN|DISCORD_BOT_TOKEN|ANNOUNCE_CHANNEL_ID|ENTRY_CHANNEL_ID|ADMIN_DISCORD_IDS|VIEW_LOG_INGEST_URL|VIEW_LOG_INGEST_SECRET)=' > .env.production

      - name: Build and deploy
        run: |
          docker compose -f docker-compose.raspi.yml build
          docker compose -f docker-compose.raspi.yml up -d

      - name: Show container status and logs
        if: always()
        run: |
          sleep 10
          docker ps -a
          echo "--- App Logs ---"
          docker compose -f docker-compose.raspi.yml logs --tail 100

      - name: Clean up old images
        run: docker image prune -f
