services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env.production
    environment:
      - RAILS_ENV=production
    restart: always

  discord-bot:
    build:
      context: ./discord-bot
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env.production
    environment:
      - API_BASE_URL=http://app:8080/api
      - PORT=3000
    depends_on:
      - app
    restart: always
